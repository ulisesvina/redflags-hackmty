[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["llm: needs .env and the cluster"]

[tool.ruff]
target-version = "py311"
# scripts/judges/ is the judges' own code, vendored verbatim (#88). Linting it would
# mean editing it, and then it would no longer be their file.
extend-exclude = ["scripts/judges"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
